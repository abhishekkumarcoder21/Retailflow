# Test Configuration
spring.application.name=retailflow-api-test
spring.datasource.url=jdbc:h2:mem:retailflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=TestSecretKeyForRetailFlowUnitTestsMustBe256BitsMinimumLengthKey!
app.jwt.expiration-ms=3600000
app.jwt.cookie-name=retailflow_token
app.cors.allowed-origins=http://localhost:3000
